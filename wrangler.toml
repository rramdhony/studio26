name = "studio26-site"
main = "src/index.js"
compatibility_date = "2026-05-25"
workers_dev = false
routes = [
  { pattern = "studio26.me/*", zone_name = "studio26.me" },
  { pattern = "www.studio26.me/*", zone_name = "studio26.me" }
]

[assets]
directory = "./public"
binding = "ASSETS"
# Only API and video requests invoke the Worker. Pages and assets are served directly, so they
# cost no Worker requests and stay up if the daily Workers quota is exhausted (with
# run_worker_first = true, every request counted and an exhausted quota returned 429 site-wide).
# Consequence: the Worker no longer sees page requests on www.studio26.me, so the www -> apex
# 301 for pages must come from a Cloudflare Redirect Rule ("Redirect from WWW to Root").
run_worker_first = ["/api/*", "/video/*"]

[[d1_databases]]
binding = "DB"
database_name = "studio26-db"
database_id = "250ea13a-9a9d-4c04-816d-204b7b2eef9c"
migrations_dir = "migrations"

[[send_email]]
name = "NOTIFY"

[vars]
NOTIFY_FROM = "enquiries@studio26.me"
ENQUIRY_GLOBAL_PER_HOUR = "50"

[[ratelimits]]
name = "ENQUIRY_GATE"
namespace_id = "260261105"
simple = { limit = 15, period = 60 }

# Telemetry gates, checked before any D1 query so a flood cannot spend the D1 daily quota
# that the enquiry form depends on. Keyed per visitor network; approximate, per Cloudflare location.
[[ratelimits]]
name = "EVENT_GATE"
namespace_id = "260261112"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ASH_GATE"
namespace_id = "260261113"
simple = { limit = 12, period = 60 }

[triggers]
crons = ["*/5 * * * *"]
