<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=DM+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    .video-wrap { position: fixed; inset: 0; z-index: 0; }

    video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Screens far from 9:16 or 16:9 (tablets, square windows) frame the reel rather than crop its type */
    @media (min-aspect-ratio: 5/8) and (max-aspect-ratio: 3/2) {
      video { object-fit: contain; }
    }

    .skip-link {
      position: absolute;
      top: 16px;
      left: -9999px;
      z-index: 10;
      padding: 12px 16px;
      background: #FAFAF8;
      color: #0C0C0C;
      font: 400 16px 'DM Mono', monospace;
      text-decoration: none;
    }
    .skip-link:focus { left: 16px; }

    /* Difference blend keeps the UI legible over both the dark and the white scenes of the reel */
    .ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      color: #fff;
      mix-blend-mode: difference;
      pointer-events: none;
    }
    .ui a, .ui button { pointer-events: auto; }

    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

    .logo {
      position: absolute;
      top: clamp(24px, 4vw, 48px);
      left: clamp(24px, 4vw, 48px);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(18px, 2.4vw, 28px);
      line-height: 1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .footer {
      position: absolute;
      bottom: clamp(20px, 3vh, 36px);
      right: clamp(24px, 4vw, 48px);
      text-align: right;
      font-family: 'DM Mono', monospace;
      font-size: clamp(14px, 1.1vw, 15px);
      letter-spacing: 0.04em;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    .footer a {
      display: inline-block;
      padding: 12px 0;
      margin: -12px 0;
      color: inherit;
      text-decoration: none;
    }
    .footer a:hover { color: #fff; }

    .controls {
      position: absolute;
      bottom: clamp(12px, 3vh, 28px);
      left: clamp(12px, 4vw, 38px);
      display: flex;
      gap: 4px;
    }

    .ctrl {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.8);
      transition: color 0.25s;
    }
    .ctrl:hover { color: #fff; }
    .ctrl svg { width: 20px; height: 20px; display: block; }

    .i-play, .i-unmuted { display: none !important; }
    #playBtn.paused .i-pause, #soundBtn.unmuted .i-muted { display: none !important; }
    #playBtn.paused .i-play, #soundBtn.unmuted .i-unmuted { display: block !important; }

    @media (prefers-reduced-motion: no-preference) {
      .logo { animation: fadeIn 1.2s ease both 0.8s; }
      .footer, .controls { animation: fadeIn 1s ease both 2s; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="video-wrap">
    <video id="bgVideo" muted loop playsinline preload="auto" aria-hidden="true"></video>
  </div>
  <script>
    (function () {
      var portrait = window.matchMedia('(max-aspect-ratio: 1/1)');
      var base = 'https://pub-accaa99b083244a1a58f40dfa9cfaa9f.r2.dev/';
      var vid = document.getElementById('bgVideo');
      // ?v= busts browser caches of the previous reel; bump it whenever the R2 files change.
      function pick() { return base + (portrait.matches ? 'studio26-teaser-mobile.mp4' : 'studio26-teaser.mp4') + '?v=3'; }
      vid.src = pick();
      portrait.addEventListener('change', function () {
        var t = vid.currentTime, playing = !vid.paused;
        vid.src = pick();
        vid.addEventListener('loadedmetadata', function () {
          vid.currentTime = t;
          if (playing) vid.play().catch(function () {});
        }, { once: true });
      });
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // Hold on the first finished scene instead of auto-playing.
        vid.addEventListener('loadedmetadata', function () { vid.currentTime = 7.6; }, { once: true });
      } else {
        vid.play().catch(function () {});
      }
    })();
  </script>

  <main id="main-content" class="ui">
    <h1 class="logo">Studio26</h1>

    <div class="footer">
      <div>studio26.me</div>
      <div><a href="mailto:hello@studio26.me">hello@studio26.me</a></div>
    </div>

    <div class="controls">
      <button class="ctrl" id="playBtn" type="button" aria-label="Pause video">
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>
        </svg>
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <polygon points="7 4 20 12 7 20 7 4"/>
        </svg>
      </button>
      <button class="ctrl" id="soundBtn" type="button" aria-label="Unmute">
        <svg class="i-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <svg class="i-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
    </div>
  </main>

  <script>
    (function () {
      var video = document.getElementById('bgVideo');
      var playBtn = document.getElementById('playBtn');
      var soundBtn = document.getElementById('soundBtn');

      function syncPlay() {
        playBtn.classList.toggle('paused', video.paused);
        playBtn.setAttribute('aria-label', video.paused ? 'Play video' : 'Pause video');
      }
      playBtn.addEventListener('click', function () {
        if (video.paused) video.play(); else video.pause();
      });
      video.addEventListener('play', syncPlay);
      video.addEventListener('pause', syncPlay);
      syncPlay();

      soundBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        soundBtn.classList.toggle('unmuted', !video.muted);
        soundBtn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute');
        if (!video.muted && video.paused) video.play();
      });
    })();
  </script>

</body>
</html>
