name: Deploy to Cloudflare

# Pull requests run the checks only. A push to main runs the checks, then deploys to production.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the Chromium download (postinstall). These checks need no browser;
      # the Playwright suite stays local (npm run qa), as the Build & Deploy Playbook requires.
      - name: Install the lockfile-pinned dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests (Ash matcher, Worker endpoints, config guards)
        run: npm run test:ash

      - name: HTML validation
        run: npm run qa:html

      - name: Wrangler build check (no upload)
        run: npx wrangler deploy --dry-run

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the lockfile-pinned dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker + static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1ecd7ea82a6e81ddd3c7a583e4c1b89
